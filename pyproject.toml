[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cks-runtime"
dynamic = ["version"]

description = "Canonical Runtime for the Canonical Knowledge Structure ecosystem"

readme = "README.md"

authors = [
    { name = "Vladyslav Hruznov" }
]

license = { text = "MIT" }

requires-python = ">=3.12"

dependencies = [
    "cks-core>=1.23.1",
    "numpy>=1.26",
]

keywords = [
    "canonical-knowledge-structure",
    "runtime",
    "knowledge-runtime",
    "transactions",
    "sessions",
    "versioning",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/PunctumActus/cks-runtime"
Repository = "https://github.com/PunctumActus/cks-runtime"
Issues = "https://github.com/PunctumActus/cks-runtime/issues"

[tool.setuptools.dynamic]
version = {attr = "cks_runtime._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
postgres = [
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3.0",
]
fastembed = [
    "fastembed>=0.3",
]
gossip = [
    "aiohttp>=3.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.0",
    "requests>=2.0",
]