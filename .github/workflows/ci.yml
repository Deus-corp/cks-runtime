name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cks
          POSTGRES_PASSWORD: cks
          POSTGRES_DB: cks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CKS_TEST_POSTGRES_DSN: postgresql://cks:cks@localhost:5432/cks_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable pgvector extension
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=cks psql -h localhost -U cks -d cks_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Install dependencies
        run: pip install -e ".[dev,postgres]"

      - name: Ruff
        run: ruff check .

      - name: mypy
        run: mypy cks_runtime

      - name: pytest
        run: pytest tests/ -v